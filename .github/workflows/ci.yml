name: Build and test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            executable: selfmate
          - os: windows-latest
            executable: selfmate.exe
          - os: macos-latest
            executable: selfmate
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
      - name: Build
        run: cmake --build build --config Release --parallel 2
      - name: Test chess rules and selfmate search
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Test the UCI process
        run: python tests/uci_test.py bin/${{ matrix.executable }}
      - name: Record corresponding source
        run: >-
          python -c "import os; from pathlib import Path; Path('bin/SOURCE.txt').write_text('Source for this binary: https://github.com/' + os.environ['GITHUB_REPOSITORY'] + '/tree/' + os.environ['GITHUB_SHA'] + '\n', encoding='utf-8')"
      - name: Package corresponding source
        run: git archive --format=tar.gz --output=bin/selfmate-source.tar.gz HEAD
      - name: Upload engine and license
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selfmate-${{ runner.os }}-${{ runner.arch }}
          path: |
            bin/${{ matrix.executable }}
            bin/SOURCE.txt
            bin/selfmate-source.tar.gz
            COPYING
            THIRD_PARTY.md
            README.md
          if-no-files-found: error
          retention-days: 14

  sanitizers:
    name: Address and undefined behavior sanitizers
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Configure with runtime checks
        run: >-
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test with runtime checks
        run: ctest --test-dir build --output-on-failure
      - name: Test UCI with runtime checks
        run: python tests/uci_test.py bin/selfmate
